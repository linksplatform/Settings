name: Sync .editorconfig to all repositories

on:
  push:
    branches: [main]
    paths:
      - '.editorconfig'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sync-editorconfig:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get all linksplatform repositories
        id: get-repos
        run: |
          # Get all repositories from linksplatform organization
          gh search repos --owner linksplatform --limit 100 --json name | jq -r '.[].name' > repos.txt
          echo "Found $(wc -l < repos.txt) repositories to sync"
          cat repos.txt

      - name: Sync .editorconfig to all repositories
        run: |
          # Read the current .editorconfig content
          if [ ! -f .editorconfig ]; then
            echo "Error: .editorconfig file not found"
            exit 1
          fi
          
          # Create temporary directory for cloning
          mkdir -p /tmp/sync-repos
          
          # Process each repository
          while IFS= read -r repo_name; do
            echo "Processing repository: $repo_name"
            
            # Skip the Settings repository itself to avoid infinite loops
            if [ "$repo_name" = "Settings" ]; then
              echo "Skipping Settings repository (current repo)"
              continue
            fi
            
            # Clone the repository
            cd /tmp/sync-repos
            if gh repo clone "linksplatform/$repo_name" "$repo_name" 2>/dev/null; then
              cd "$repo_name"
              
              # Check if the repository has a different .editorconfig or no .editorconfig
              if [ ! -f .editorconfig ] || ! cmp -s .editorconfig "$GITHUB_WORKSPACE/.editorconfig"; then
                echo "Updating .editorconfig in $repo_name"
                
                # Copy the new .editorconfig
                cp "$GITHUB_WORKSPACE/.editorconfig" .editorconfig
                
                # Check if there are changes to commit
                if ! git diff --quiet; then
                  # Create a new branch for the update
                  branch_name="sync-editorconfig-$(date +%Y%m%d-%H%M%S)"
                  git checkout -b "$branch_name"
                  
                  # Commit the changes
                  git add .editorconfig
                  git commit -m "Sync .editorconfig from Settings repository

This update synchronizes the .editorconfig file from the Settings repository
to ensure consistent code formatting across all linksplatform repositories.

Auto-generated by GitHub Actions in linksplatform/Settings."
                  
                  # Push the branch
                  git push origin "$branch_name"
                  
                  # Create a pull request
                  gh pr create \
                    --title "Sync .editorconfig from Settings repository" \
                    --body "This PR synchronizes the .editorconfig file from the Settings repository to ensure consistent code formatting across all linksplatform repositories.

**Changes:**
- Updated .editorconfig with latest settings from linksplatform/Settings

**Note:** This is an automated update triggered by changes to .editorconfig in the Settings repository." \
                    --base main \
                    --head "$branch_name" \
                    --repo "linksplatform/$repo_name" || echo "Failed to create PR for $repo_name (might already exist or other issue)"
                else
                  echo "No changes needed for $repo_name"
                fi
              else
                echo ".editorconfig is already up to date in $repo_name"
              fi
              
              # Clean up
              cd /tmp/sync-repos
              rm -rf "$repo_name"
            else
              echo "Failed to clone or access repository: $repo_name"
            fi
          done < "$GITHUB_WORKSPACE/repos.txt"
          
          echo "Sync process completed"